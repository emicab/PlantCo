<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="./componentes/NavBar.js"></script>
    <script type="module" src="./componentes/Login.js"></script>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/normalizer.css" />
    <title>Ficha de Producto | PlantCo.</title>
  </head>
  <body>
    <header>
      <nav-bar></nav-bar>
    </header>

    <main class="container my-5">
      <div class="mb-4">
        <a href="productos.html" class="text-success text-decoration-none">
          &larr; Volver al catálogo
        </a>
      </div>

      <p id="ficha-mensaje" class="text-center font-medium my-8">Cargando producto...</p>

      <div id="ficha-detalle" class="row hidden">
        <div class="col-md-6 mb-4 flex flex-col items-center">
          <figure class="border p-3 bg-white rounded text-center w-full">
            <img
              id="ficha-imagen"
              src=""
              alt=""
              class="img-fluid mx-auto"
              style="max-height: 400px; object-fit: contain"
            />
            <figcaption id="ficha-caption" class="text-muted mt-2 small"></figcaption>
          </figure>
        </div>

        <div class="col-md-6">
          <article class="p-3">
            <h1 id="ficha-titulo" class="h2 mb-2 text-dark font-bold"></h1>
            <p id="ficha-precio" class="h4 text-success mb-3 font-bold"></p>

            <div class="mb-4">
              <p id="ficha-descripcion" class="text-gray-700"></p>
            </div>

            <div id="ficha-tags" class="flex gap-2 mb-4"></div>

            <button
              id="ficha-btn-carrito"
              type="button"
              class="btn btn-success btn-lg w-100 font-bold"
            >
              Agregar al Carrito
            </button>
          </article>
        </div>
      </div>
    </main>

    <footer class="footer">
      <a href="index.html" class="footer-logo">PlantCo.</a>
      <ul class="footer-links">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="categoria.html">Categorías</a></li>
        <li><a href="newsletter.html">Newsletter</a></li>
        <li><a href="comparativa.html">Comparativa</a></li>
      </ul>
      <p class="footer-info">© 2026 PlantCo.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/ficha.js"></script>
  </body>
</html>
